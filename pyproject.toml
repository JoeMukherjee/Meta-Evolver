[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-evolver"
version = "0.2.0"
description = "A LangGraph engine for LLM agents that improve on any benchmark, generation over generation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Joe Mukherjee" }]
keywords = [
    "llm-agents",
    "langgraph",
    "self-improving-agents",
    "agent-memory",
    "prompt-optimization",
    "curriculum-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langgraph>=0.2.60",
    "litellm>=1.50.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/JoeMukherjee/Meta-Evolver"
Issues = "https://github.com/JoeMukherjee/Meta-Evolver/issues"

[project.scripts]
meta-evolver = "meta_evolver.cli.main:main"

[tool.setuptools.packages.find]
include = ["meta_evolver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
